<template>
    <div class="detail-card">
        <!-- Minimal Header + Reclassify Toggle -->
        <div class="top-bar">
            <span class="card-title">Audit Event Details</span>
            <div>
                <template lwc:if={isEditingClassification}>
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancelClassification}
                        disabled={isSaving}
                        class="slds-m-right_xx-small">
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={handleSaveClassification}
                        disabled={isSaving}>
                    </lightning-button>
                </template>
                <template lwc:else>
                    <lightning-button
                        label="Reclassify"
                        icon-name="utility:edit"
                        onclick={handleEditClassification}>
                    </lightning-button>
                </template>
            </div>
        </div>

        <!-- Inline Classification Editor (Shown Only When Reclassifying) -->
        <template lwc:if={isEditingClassification}>
            <div class="edit-box">
                <lightning-record-edit-form
                    record-id={recordId}
                    object-api-name="Auditr_Entry__c"
                    density="compact"
                    onsuccess={handleClassificationSuccess}
                    onerror={handleClassificationError}>
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field field-name="Risk_Level__c" required></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field field-name="Category__c" required></lightning-input-field>
                        </div>
                    </div>
                    <button type="submit" class="slds-hide" data-id="hiddenSubmitBtn">Submit</button>
                </lightning-record-edit-form>
            </div>
        </template>

        <!-- Audit Trail Change Description -->
        <div class="display-box" title="SetupAuditTrail Display">
            {displayText}
        </div>

        <!-- Compact 2-Row Read-Only Metadata Grid (10 Fields) -->
        <div class="meta-grid">
            <div class="meta-item">
                <div class="meta-label">Section</div>
                <div class="meta-value" title={section}>{section}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Action Code</div>
                <div class="meta-value mono" title={actionCode}>{actionCode}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Occurred At</div>
                <div class="meta-value">
                    <lightning-formatted-date-time
                        value={occurredAt}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                        second="2-digit">
                    </lightning-formatted-date-time>
                </div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Responsible Actor</div>
                <div class="meta-value" title={responsibleUsername}>{responsibleUsername}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Acted As</div>
                <div class="meta-value" title={actorUsername}>{actorUsername}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Delegate User</div>
                <div class="meta-value" title={delegateUser}>{delegateUser}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Actor Context</div>
                <div class="meta-value" title={actorContext}>{actorContext}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Namespace</div>
                <div class="meta-value mono" title={namespacePrefix}>{namespacePrefix}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Source</div>
                <div class="meta-value">{source}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Source Record ID</div>
                <div class="meta-value mono" title={sourceRecordId}>{sourceRecordId}</div>
            </div>
        </div>
    </div>
</template>
