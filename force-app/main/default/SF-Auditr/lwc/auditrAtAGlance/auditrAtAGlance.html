<template>
    <div class="at-a-glance-card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="header-title">
                <lightning-icon icon-name="standard:shield" size="small" alternative-text="Auditr"></lightning-icon>
                <h2 class="title-text">Auditr At a Glance</h2>
            </div>
            <div class="header-actions">
                <lightning-combobox
                    name="windowSelector"
                    label="Time Window"
                    variant="label-hidden"
                    value={selectedWindow}
                    options={windowOptions}
                    onchange={handleWindowChange}
                    class="window-combobox"
                ></lightning-combobox>
                <lightning-button
                    label={incidentButtonLabel}
                    icon-name="utility:clock"
                    variant={incidentButtonVariant}
                    onclick={handleToggleIncidentMode}
                ></lightning-button>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh Metrics"
                    title="Refresh Metrics"
                    onclick={handleRefresh}
                ></lightning-button-icon>
            </div>
        </div>

        <template lwc:if={errorMessage}>
            <div class="slds-scoped-notification slds-media slds-media_center slds-m-bottom_medium" role="alert">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:error" variant="error" size="small" alternative-text="Error"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p>{errorMessage}</p>
                </div>
            </div>
        </template>

        <!-- 6-KPI Strip -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <p class="kpi-label" title="Total Audit Events (Capped at 25,000)">Total Events</p>
                <p class="kpi-value">
                    <lightning-formatted-number value={metrics.totalEntries}></lightning-formatted-number>{totalEntriesSuffix}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Critical and High Risk (Capped at 5,000)">Critical &amp; High</p>
                <p class="kpi-value kpi-value-danger">
                    <lightning-formatted-number value={metrics.criticalAndHighCount}></lightning-formatted-number>{criticalAndHighSuffix}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Security and Access Changes (Capped at 5,000)">Security &amp; Access</p>
                <p class="kpi-value">
                    <lightning-formatted-number value={metrics.securityAndAccessCount}></lightning-formatted-number>{securityAndAccessSuffix}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Automation, Code, and Data Model Changes (Capped at 5,000)">Automation &amp; Code</p>
                <p class="kpi-value">
                    <lightning-formatted-number value={metrics.automationAndMetadataCount}></lightning-formatted-number>{automationAndMetadataSuffix}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Delegated / Login-As Activity (Capped at 5,000)">Impersonated</p>
                <p class="kpi-value">
                    <lightning-formatted-number value={metrics.impersonatedCount}></lightning-formatted-number>{impersonatedSuffix}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Unclassified Events (Capped at 5,000)">Unclassified</p>
                <p class="kpi-value">
                    <lightning-formatted-number value={metrics.unclassifiedCount}></lightning-formatted-number>{unclassifiedSuffix}
                </p>
            </div>
        </div>

        <!-- Watermark Footer -->
        <div class="watermark-footer">
            <span class="slds-text-body_small slds-text-color_weak">
                <template lwc:if={metrics.lastSyncedOccurredAt}>
                    Latest synced audit event:&nbsp;
                    <lightning-formatted-date-time
                        value={metrics.lastSyncedOccurredAt}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                </template>
                <template lwc:else>
                    No audit events synced yet. Open the Control Center tab to run initial sync.
                </template>
            </span>
            <span class="slds-text-body_small slds-text-color_weak">
                Window: {selectedWindowLabel} &bull; Capped at 25k total / 5k per KPI
            </span>
        </div>

        <!-- Incident Mode Panel (inspired by WhatChanged) -->
        <template lwc:if={isIncidentModeOpen}>
            <div class="incident-panel">
                <div class="slds-m-bottom_small">
                    <h3 class="slds-text-heading_small">Incident Mode — What Changed Around a Timestamp?</h3>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Pinpoint every Setup configuration change within a tight window around a production issue or deployment (up to 100 events).
                    </p>
                </div>

                <div class="incident-controls">
                    <div class="incident-control-time">
                        <lightning-input
                            type="datetime"
                            name="incidentTimestamp"
                            label="Incident Timestamp"
                            value={incidentTimestamp}
                            onchange={handleIncidentTimeChange}
                        ></lightning-input>
                    </div>
                    <div class="incident-control-radius">
                        <lightning-combobox
                            name="incidentRadius"
                            label="Window Radius"
                            value={incidentRadius}
                            options={radiusOptions}
                            onchange={handleRadiusChange}
                        ></lightning-combobox>
                    </div>
                    <div class="incident-control-toggle">
                        <lightning-input
                            type="toggle"
                            label="Critical &amp; High Risk Only"
                            name="highRiskOnly"
                            checked={highRiskOnly}
                            message-toggle-active="High/Critical Only"
                            message-toggle-inactive="All Risk Levels"
                            onchange={handleHighRiskToggle}
                        ></lightning-input>
                    </div>
                    <div class="incident-control-action">
                        <lightning-button
                            label="Investigate"
                            variant="brand"
                            icon-name="utility:search"
                            onclick={handleRunIncidentSearch}
                            disabled={isLoadingIncident}
                        ></lightning-button>
                    </div>
                </div>

                <template lwc:if={isLoadingIncident}>
                    <div class="slds-p-vertical_medium slds-is-relative">
                        <lightning-spinner alternative-text="Loading incident timeline" size="small"></lightning-spinner>
                    </div>
                </template>

                <template lwc:if={hasIncidentRows}>
                    <lightning-datatable
                        key-field="recordId"
                        data={incidentRows}
                        columns={incidentColumns}
                        hide-checkbox-column
                    ></lightning-datatable>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak slds-p-top_x-small">
                        No audit events matched the selected incident window.
                    </p>
                </template>
            </div>
        </template>
    </div>
</template>
