<template>
    <div class="at-a-glance-card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="header-title">
                <h2 class="title-text">Auditr At a Glance</h2>
            </div>
            <div class="header-actions">
                <lightning-combobox
                    name="windowSelector"
                    label="Time Window"
                    variant="label-hidden"
                    value={selectedWindow}
                    options={windowOptions}
                    onchange={handleWindowChange}
                    class="window-combobox"
                ></lightning-combobox>
                <lightning-button
                    label="Audit Mode"
                    icon-name="utility:task"
                    variant="neutral"
                    onclick={handleOpenAuditMode}
                ></lightning-button>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh Metrics"
                    title="Refresh Metrics"
                    onclick={handleRefresh}
                ></lightning-button-icon>
            </div>
        </div>

        <template lwc:if={errorMessage}>
            <div class="slds-scoped-notification slds-media slds-media_center slds-m-bottom_medium" role="alert">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:error" variant="error" size="small" alternative-text="Error"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p>{errorMessage}</p>
                </div>
            </div>
        </template>

        <!-- KPI Strip -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <p class="kpi-label" title="Total Audit Events (Capped at 25,000)">Total Events</p>
                <p class="kpi-value" title={metrics.totalEntries}>
                    {formattedTotalEntries}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Critical and High Risk (Capped at 5,000)">Critical &amp; High</p>
                <p class="kpi-value kpi-value-danger" title={metrics.criticalAndHighCount}>
                    {formattedCriticalAndHighCount}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Security and Access Changes (Capped at 5,000)">Security &amp; Access</p>
                <p class="kpi-value" title={metrics.securityAndAccessCount}>
                    {formattedSecurityAndAccessCount}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Automation, Code, and Data Model Changes (Capped at 5,000)">Automation &amp; Code</p>
                <p class="kpi-value" title={metrics.automationAndMetadataCount}>
                    {formattedAutomationAndMetadataCount}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Delegated / Login-As Activity (Capped at 5,000)">Impersonated</p>
                <p class="kpi-value" title={metrics.impersonatedCount}>
                    {formattedImpersonatedCount}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Unclassified Events (Capped at 5,000)">Unclassified</p>
                <p class="kpi-value" title={metrics.unclassifiedCount}>
                    {formattedUnclassifiedCount}
                </p>
            </div>

            <div class="kpi-card">
                <p class="kpi-label" title="Audit entries with no Change Log citation — compliance exceptions (Capped at 5,000)">Unassigned Changes</p>
                <p class="kpi-value kpi-value-warning" title={metrics.unassignedChangeCount}>
                    {formattedUnassignedChangeCount}
                </p>
            </div>
        </div>

        <!-- Watermark Footer -->
        <div class="watermark-footer">
            <span class="slds-text-body_small slds-text-color_weak">
                <template lwc:if={metrics.lastSyncedOccurredAt}>
                    Latest synced audit event:&nbsp;
                    <lightning-formatted-date-time
                        value={metrics.lastSyncedOccurredAt}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                </template>
                <template lwc:else>
                    No audit events synced yet. Open the Control Center tab to run initial sync.
                </template>
            </span>
            <span class="slds-text-body_small slds-text-color_weak">
                Window: {selectedWindowLabel} &bull; Capped at 25k total / 5k per KPI
            </span>
        </div>
    </div>
</template>
