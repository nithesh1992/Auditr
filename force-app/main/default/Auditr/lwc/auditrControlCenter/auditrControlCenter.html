<template>
    <div class="control-center-layout">
        <!-- Main Operational Header Card -->
        <div class="cc-card">
            <div class="card-header">
                <div class="header-title">
                    <lightning-icon icon-name="standard:settings" size="small" alternative-text="Control Center"></lightning-icon>
                    <h2 class="title-text">Auditr Control Center</h2>
                </div>
                <div class="header-actions">
                    <lightning-button
                        label="Sync Now"
                        variant="brand"
                        icon-name="utility:sync"
                        onclick={handleSyncNow}
                        disabled={isBusy}
                    ></lightning-button>
                    <lightning-button
                        label="Reclassify Unclassified"
                        icon-name="utility:magicwand"
                        onclick={handleReclassifyUnclassified}
                        disabled={isBusy}
                    ></lightning-button>
                    <lightning-button
                        label="Reclassify All"
                        onclick={handleReclassifyAll}
                        disabled={isBusy}
                    ></lightning-button>
                    <lightning-button
                        label="Run Retention Purge"
                        icon-name="utility:delete"
                        onclick={handlePurgeNow}
                        disabled={isBusy}
                    ></lightning-button>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh Control Center"
                        title="Refresh Control Center"
                        onclick={handleRefresh}
                    ></lightning-button-icon>
                </div>
            </div>

            <template lwc:if={status.isStaleSync}>
                <div class="slds-scoped-notification slds-media slds-media_center slds-m-bottom_medium" role="status">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:warning" variant="warning" size="small" alternative-text="Warning"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p><strong>Health Notice:</strong> {status.healthWarning}</p>
                    </div>
                </div>
            </template>

            <!-- Operational Summary Strip (3 Cards) -->
            <div class="summary-grid">
                <div class="summary-card">
                    <p class="summary-label">Ingestion Engine</p>
                    <p class="summary-value">{engineStatusLabel}</p>
                    <p class="summary-subtext">
                        Backfill: {status.backfillDays}d &bull; Batch: {status.batchSize}
                    </p>
                </div>

                <div class="summary-card">
                    <p class="summary-label">Daily Sync Schedule</p>
                    <p class="summary-value">{scheduleStatusLabel}</p>
                    <p class="summary-subtext">
                        <template lwc:if={status.isScheduled}>
                            Next:&nbsp;
                            <lightning-formatted-date-time
                                value={status.nextFireTime}
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit"
                            ></lightning-formatted-date-time>
                        </template>
                        <template lwc:else>Preferred hour: {status.preferredSyncHour}:00</template>
                    </p>
                </div>

                <div class="summary-card">
                    <p class="summary-label">Retention Policy</p>
                    <p class="summary-value">{retentionStatusLabel}</p>
                    <p class="summary-subtext">
                        Configure in Setup &rarr; Custom Metadata Types
                    </p>
                </div>
            </div>

            <!-- Daily Schedule Controls -->
            <div class="schedule-box">
                <div class="schedule-hour-picker">
                    <lightning-combobox
                        name="scheduleHour"
                        label="Daily Sync Hour (Org Time Zone)"
                        value={selectedHour}
                        options={hourOptions}
                        onchange={handleHourChange}
                    ></lightning-combobox>
                </div>
                <div class="schedule-actions">
                    <lightning-button
                        label="Schedule Daily Sync"
                        variant="neutral"
                        icon-name="utility:event"
                        onclick={handleScheduleSync}
                        disabled={isBusy}
                    ></lightning-button>
                    <template lwc:if={status.isScheduled}>
                        <lightning-button
                            label="Unschedule"
                            variant="destructive-text"
                            icon-name="utility:clear"
                            onclick={handleUnscheduleSync}
                            disabled={isBusy}
                        ></lightning-button>
                    </template>
                    <template lwc:if={status.scheduleOwnerUsername}>
                        <span class="slds-text-body_small slds-text-color_weak">
                            Scheduled by: {status.scheduleOwnerUsername}
                        </span>
                    </template>
                </div>
            </div>
        </div>

        <!-- Middle Row: Unclassified Actions & Recent Batch Jobs -->
        <div class="middle-row-grid">
            <!-- Left Column: Top Unclassified Actions -->
            <div class="cc-card">
                <div class="card-header">
                    <div class="header-title">
                        <lightning-icon icon-name="standard:task2" size="small" alternative-text="Unclassified Actions"></lightning-icon>
                        <h2 class="title-text">Top Unclassified Setup Actions (Last 30 Days &bull; Top 10)</h2>
                    </div>
                </div>
                <template lwc:if={hasUnclassifiedActions}>
                    <lightning-datatable
                        key-field="rowKey"
                        data={unclassifiedActionRows}
                        columns={unclassifiedColumns}
                        hide-checkbox-column
                    ></lightning-datatable>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">
                        No unclassified setup actions in the last 30 days.
                    </p>
                </template>
            </div>

            <!-- Right Column: Recent AsyncApexJob Executions -->
            <div class="cc-card">
                <div class="card-header">
                    <div class="header-title">
                        <lightning-icon icon-name="standard:process" size="small" alternative-text="Batch Jobs"></lightning-icon>
                        <h2 class="title-text">Recent Batch Jobs (Last 10 Runs)</h2>
                    </div>
                </div>
                <template lwc:if={hasRecentJobs}>
                    <lightning-datatable
                        key-field="jobId"
                        data={status.recentJobs}
                        columns={jobColumns}
                        hide-checkbox-column
                    ></lightning-datatable>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">
                        No Auditr batch executions recorded yet.
                    </p>
                </template>
            </div>
        </div>

        <!-- Full Width: Active Classification Rules Inspector -->
        <div class="cc-card">
            <div class="card-header">
                <div class="header-title">
                    <lightning-icon icon-name="standard:decision" size="small" alternative-text="Active Rules"></lightning-icon>
                    <h2 class="title-text">{rulesCardTitle}</h2>
                </div>
            </div>
            <div class="rule-search-bar">
                <lightning-input
                    type="search"
                    name="ruleSearch"
                    label="Filter Rules"
                    variant="label-hidden"
                    placeholder="Search by rule label, match value, category, or risk..."
                    value={ruleSearchTerm}
                    onchange={handleRuleSearchChange}
                ></lightning-input>
            </div>
            <lightning-datatable
                key-field="developerName"
                data={filteredRules}
                columns={ruleColumns}
                hide-checkbox-column
            ></lightning-datatable>
        </div>
    </div>
</template>
