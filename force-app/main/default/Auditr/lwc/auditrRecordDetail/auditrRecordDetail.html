<template>
    <div class="detail-card">
        <!-- Minimal Header + Reclassify Toggle -->
        <div class="top-bar">
            <span class="card-title">Audit Event Details</span>
            <div>
                <template lwc:if={isEditingClassification}>
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancelClassification}
                        disabled={isSaving}
                        class="slds-m-right_xx-small">
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={handleSaveClassification}
                        disabled={isSaving}>
                    </lightning-button>
                </template>
                <template lwc:else>
                    <lightning-button
                        label="Reclassify"
                        icon-name="utility:edit"
                        onclick={handleEditClassification}>
                    </lightning-button>
                </template>
            </div>
        </div>

        <!-- Inline Classification Editor (Shown Only When Reclassifying) -->
        <template lwc:if={isEditingClassification}>
            <div class="edit-box">
                <lightning-record-edit-form
                    record-id={recordId}
                    object-api-name="Auditr_Entry__c"
                    density="compact"
                    onsuccess={handleClassificationSuccess}
                    onerror={handleClassificationError}>
                    <lightning-messages></lightning-messages>
                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field field-name="Risk_Level__c" required></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input-field field-name="Category__c" required></lightning-input-field>
                        </div>
                    </div>
                    <button type="submit" class="slds-hide" data-id="hiddenSubmitBtn">Submit</button>
                </lightning-record-edit-form>
            </div>
        </template>

        <!-- Audit Trail Change Description -->
        <div class="display-box" title="Audit Event Display">
            {displayText}
        </div>

        <!-- Conditional Warning Banner for Inferred Login-As Delegation on Watched Objects -->
        <template lwc:if={isInferredWatchedObjectDelegate}>
            <div class="inferred-delegate-warning" role="alert" data-id="inferredDelegateWarning">
                <lightning-icon
                    icon-name="utility:warning"
                    size="x-small"
                    variant="warning"
                    class="warning-icon">
                </lightning-icon>
                <div class="warning-text">
                    <strong>Inferred Login-As Delegation:</strong> Delegate User (<strong>{delegateUser}</strong>) was inferred by correlating this data change's timestamp with an active Login-As session in Setup Audit Trail. Because standard Salesforce Field History does not record session IDs, it is still possible that the original user (<strong>{actorUsername}</strong>) made this change concurrently.
                </div>
            </div>
        </template>

        <!-- Compact 2-Row Read-Only Metadata Grid (10 Fields) -->
        <div class="meta-grid">
            <div class="meta-item">
                <div class="meta-label">Section</div>
                <div class="meta-value" title={section}>{section}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Action Code</div>
                <div class="meta-value mono" title={actionCode}>{actionCode}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Occurred At</div>
                <div class="meta-value">
                    <lightning-formatted-date-time
                        value={occurredAt}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                        second="2-digit">
                    </lightning-formatted-date-time>
                </div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Responsible Actor</div>
                <div class="meta-value" title={responsibleUsername}>{responsibleUsername}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Acted As</div>
                <div class="meta-value" title={actorUsername}>{actorUsername}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Delegate User</div>
                <div class="meta-value" title={delegateUser}>
                    {delegateUser}
                    <template lwc:if={isInferredWatchedObjectDelegate}>
                        <span class="inferred-tag" title="Inferred from Setup Audit Trail Login-As session window">Inferred</span>
                    </template>
                </div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Actor Context</div>
                <div class="meta-value" title={actorContext}>{actorContext}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Namespace</div>
                <div class="meta-value mono" title={namespacePrefix}>{namespacePrefix}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Source</div>
                <div class="meta-value">{source}</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Source Record ID</div>
                <div class="meta-value mono" title={sourceRecordId}>{sourceRecordId}</div>
            </div>
            <template lwc:if={hasWatchedTarget}>
                <div class="meta-item">
                    <div class="meta-label">Watched Object</div>
                    <div class="meta-value" title={targetObject}>{targetObject}</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Target Record ID</div>
                    <div class="meta-value mono" title={targetRecordId}>
                        <template lwc:if={targetRecordUrl}>
                            <a href={targetRecordUrl} target="_blank" rel="noopener">{targetRecordId}</a>
                        </template>
                        <template lwc:else>{targetRecordId}</template>
                    </div>
                </div>
                <template lwc:if={hasChangedFields}>
                    <div class="meta-item meta-item_wide">
                        <div class="meta-label">Changed Fields</div>
                        <div class="field-pill-list">
                            <template for:each={changedFields} for:item="fieldName">
                                <span key={fieldName} class="field-pill mono">{fieldName}</span>
                            </template>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
