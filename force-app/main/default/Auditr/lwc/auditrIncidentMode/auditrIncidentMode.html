<template>
    <div class="incident-card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="header-title">
                <h2 class="title-text">Incident Mode — What Changed Around a Timestamp?</h2>
            </div>
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Re-run Investigation"
                title="Re-run Investigation"
                onclick={handleRunIncidentSearch}
            ></lightning-button-icon>
        </div>

        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
            Pinpoint every Setup configuration change within a tight window around a production issue or deployment (up to 100 events).
        </p>

        <template lwc:if={errorMessage}>
            <div class="slds-scoped-notification slds-media slds-media_center slds-m-bottom_medium" role="alert">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:error" variant="error" size="small" alternative-text="Error"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p>{errorMessage}</p>
                </div>
            </div>
        </template>

        <div class="incident-controls">
            <div class="incident-control-time">
                <lightning-input
                    type="datetime"
                    name="incidentTimestamp"
                    label="Incident Timestamp"
                    value={incidentTimestamp}
                    onchange={handleIncidentTimeChange}
                ></lightning-input>
            </div>
            <div class="incident-control-radius">
                <lightning-combobox
                    name="incidentRadius"
                    label="Window Radius"
                    value={incidentRadius}
                    options={radiusOptions}
                    onchange={handleRadiusChange}
                ></lightning-combobox>
            </div>
            <div class="incident-control-toggle">
                <lightning-input
                    type="toggle"
                    label="Critical &amp; High Risk Only"
                    name="highRiskOnly"
                    checked={highRiskOnly}
                    message-toggle-active="High/Critical Only"
                    message-toggle-inactive="All Risk Levels"
                    onchange={handleHighRiskToggle}
                ></lightning-input>
            </div>
            <div class="incident-control-action">
                <lightning-button
                    label="Investigate"
                    variant="brand"
                    icon-name="utility:search"
                    onclick={handleRunIncidentSearch}
                    disabled={isLoading}
                ></lightning-button>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-p-vertical_medium slds-is-relative">
                <lightning-spinner alternative-text="Loading incident timeline" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={hasIncidentRows}>
            <lightning-datatable
                key-field="recordId"
                data={incidentRows}
                columns={incidentColumns}
                hide-checkbox-column
            ></lightning-datatable>
        </template>
        <template lwc:if={showEmptyState}>
            <p class="slds-text-body_small slds-text-color_weak slds-p-top_x-small">
                No audit events matched the selected incident window. Widen the radius or clear the risk filter.
            </p>
        </template>

        <div class="watermark-footer">
            <span class="slds-text-body_small slds-text-color_weak">
                <template lwc:if={lastSyncedOccurredAt}>
                    Latest synced audit event:&nbsp;
                    <lightning-formatted-date-time
                        value={lastSyncedOccurredAt}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                </template>
                <template lwc:else>
                    No audit events synced yet. Open the Auditr Control Center tab to run initial sync.
                </template>
            </span>
        </div>
    </div>
</template>
