<template>
    <div class="audit-mode-card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="header-title">
                <h2 class="title-text">Audit Mode — Investigation &amp; Change Packaging</h2>
            </div>
            <div class="header-actions">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh Audit Mode"
                    title="Refresh Audit Mode"
                    onclick={handleRefresh}
                ></lightning-button-icon>
            </div>
        </div>

        <template lwc:if={errorMessage}>
            <div class="slds-scoped-notification slds-media slds-media_center slds-m-bottom_medium" role="alert">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:error" variant="error" size="small" alternative-text="Error"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p>{errorMessage}</p>
                </div>
            </div>
        </template>

        <!-- Unified Investigation Filter Bar -->
        <div class="filter-panel">
            <div class="time-mode-selector slds-m-bottom_medium">
                <lightning-radio-group
                    name="timeMode"
                    label="Investigation Time Mode"
                    options={timeModeOptions}
                    value={timeMode}
                    type="button"
                    onchange={handleTimeModeChange}
                ></lightning-radio-group>
            </div>

            <!-- Row 1: Symmetrically Aligned 3-Column Inputs Grid -->
            <div class="filter-inputs-grid">
                <template lwc:if={isWindowMode}>
                    <div class="filter-input">
                        <lightning-input
                            type="datetime"
                            name="windowStart"
                            label="Occurred From"
                            value={windowStartInput}
                            onchange={handleWindowStartChange}
                            required
                        ></lightning-input>
                    </div>
                    <div class="filter-input">
                        <lightning-input
                            type="datetime"
                            name="windowEnd"
                            label="Occurred To"
                            value={windowEndInput}
                            onchange={handleWindowEndChange}
                            required
                        ></lightning-input>
                    </div>
                </template>

                <template lwc:if={isIncidentMode}>
                    <div class="filter-input">
                        <lightning-input
                            type="datetime"
                            name="incidentTimestamp"
                            label="Incident Timestamp"
                            value={incidentTimestampInput}
                            onchange={handleIncidentTimestampChange}
                            required
                        ></lightning-input>
                    </div>
                    <div class="filter-input">
                        <div class="slds-form-element slds-form-element_compound">
                            <span class="slds-form-element__legend slds-form-element__label">Window Radius</span>
                            <div class="slds-form-element__control">
                                <div class="slds-form-element__row">
                                    <div class="slds-form-element slds-size_1-of-1">
                                        <label class="slds-form-element__label">Range</label>
                                        <div class="slds-form-element__control">
                                            <lightning-combobox
                                                name="incidentRadius"
                                                label="Window Radius"
                                                variant="label-hidden"
                                                value={incidentRadiusInput}
                                                options={radiusOptions}
                                                onchange={handleIncidentRadiusChange}
                                            ></lightning-combobox>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <div class="filter-input filter-input-user">
                    <div class="slds-form-element slds-form-element_compound">
                        <div class="legend-header">
                            <span class="slds-form-element__legend slds-form-element__label">Responsible Actor</span>
                            <template lwc:if={actorInput}>
                                <span class="actor-hint slds-badge slds-badge_lightest">{actorInput}</span>
                            </template>
                        </div>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__row">
                                <div class="slds-form-element slds-size_1-of-1">
                                    <label class="slds-form-element__label">User Search</label>
                                    <div class="slds-form-element__control">
                                        <lightning-record-picker
                                            label="Responsible Actor"
                                            variant="label-hidden"
                                            placeholder="Search users by name or username..."
                                            object-api-name="User"
                                            value={selectedUserId}
                                            display-info={userDisplayInfo}
                                            matching-info={userMatchingInfo}
                                            onchange={handleUserChange}
                                        ></lightning-record-picker>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 2: Aligned Options, Toggles & Action Toolbar -->
            <div class="filter-toolbar">
                <div class="filter-toggles-group">
                    <div class="filter-toggle">
                        <lightning-input
                            type="toggle"
                            label="High &amp; Critical Risk Only"
                            name="highRiskOnly"
                            checked={highRiskOnly}
                            message-toggle-active=""
                            message-toggle-inactive=""
                            onchange={handleHighRiskToggle}
                        ></lightning-input>
                    </div>

                    <div class="filter-toggle">
                        <lightning-input
                            class="burst-toggle-input"
                            type="toggle"
                            label="Group Actor Bursts"
                            name="groupBursts"
                            checked={groupBursts}
                            message-toggle-active=""
                            message-toggle-inactive=""
                            onchange={handleBurstToggle}
                        ></lightning-input>
                    </div>
                </div>

                <div class="filter-actions">
                    <lightning-button
                        label="Apply Filters"
                        variant="brand"
                        icon-name="utility:filter"
                        onclick={handleApplyFilters}
                    ></lightning-button>
                </div>
            </div>
        </div>

        <!-- Scope and Packaging Action Bar -->
        <div class="results-action-bar">
            <div class="results-stats">
                <template lwc:if={isPartiallyDisplayed}>
                    <span class="slds-badge slds-theme_warning stats-badge" title="The selected scope contains more events than can be displayed in the interactive table at once (limited to 200). 'Package All Unassigned' operates on the full unassigned scope.">
                        Showing first {formattedDisplayedCount} of {formattedTotalCount} events
                    </span>
                </template>
                <template lwc:else>
                    <span class="slds-badge slds-theme_shade stats-badge">
                        {formattedTotalCount} event(s) found
                    </span>
                </template>
                <span class="stats-item">
                    <strong>{formattedUnassignedCount}</strong> unassigned
                </span>
                <span class="stats-divider">•</span>
                <span class="stats-item">
                    <strong>{formattedPackagedCount}</strong> packaged
                </span>
            </div>
            <div class="package-buttons">
                <lightning-button
                    label={packageSelectedLabel}
                    variant="brand"
                    icon-name="utility:package"
                    onclick={handleOpenPackageSelectedModal}
                    disabled={packageSelectedDisabled}
                ></lightning-button>
                <lightning-button
                    label={packageAllLabel}
                    variant="neutral"
                    icon-name="utility:package"
                    onclick={handleOpenPackageAllModal}
                    disabled={packageAllDisabled}
                ></lightning-button>
            </div>
        </div>

        <!-- Results Table -->
        <template lwc:if={isLoading}>
            <div class="slds-p-vertical_large slds-is-relative">
                <lightning-spinner alternative-text="Loading audit entries" size="small"></lightning-spinner>
            </div>
        </template>
        <template lwc:else>
            <template lwc:if={hasEntryRows}>
                <template lwc:if={groupBursts}>
                    <lightning-tree-grid
                        key-field="recordId"
                        data={treeData}
                        columns={treeColumns}
                        selected-rows={gridSelectedRows}
                        onrowselection={handleTreeRowSelection}
                    ></lightning-tree-grid>
                </template>
                <template lwc:else>
                    <lightning-datatable
                        key-field="recordId"
                        data={displayedRows}
                        columns={flatColumns}
                        selected-rows={selectedEntryIds}
                        onrowselection={handleFlatRowSelection}
                    ></lightning-datatable>
                </template>
            </template>
            <template lwc:else>
                <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                    <p class="slds-text-heading_small slds-text-color_weak">No audit events match the selected criteria</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        Adjust the time window, widen the incident radius, or clear filters to locate events.
                    </p>
                </div>
            </template>
        </template>

        <!-- Packaging Modal (Scalable Modal-First Workflow) -->
        <template lwc:if={isPackageModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Package Changes into Change Log" class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title slds-hyphenate">Package Changes into Change Log</h2>
                        <p class="slds-m-top_xx-small slds-text-body_small slds-text-color_weak">
                            Certify audit events against an approved external Change Request for SOX ITGC and SOC 2.
                        </p>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <!-- Scope Summary Banner -->
                        <div class="slds-scoped-notification slds-media slds-media_center slds-theme_info slds-m-bottom_medium" role="status">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="utility:info" size="small" variant="inverse" alternative-text="Scope"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <p>{packageScopeSummaryText}</p>
                            </div>
                        </div>

                        <!-- Target Mode Choice -->
                        <div class="slds-m-bottom_medium">
                            <lightning-radio-group
                                name="packageTargetMode"
                                label="Change Log Target"
                                options={packageTargetOptions}
                                value={packageTargetMode}
                                type="button"
                                onchange={handlePackageTargetModeChange}
                            ></lightning-radio-group>
                        </div>

                        <!-- Link to Existing Change Log -->
                        <template lwc:if={isExistingTargetMode}>
                            <div class="existing-log-section">
                                <lightning-input
                                    type="search"
                                    label="Search Open Change Logs"
                                    placeholder="Type Change Request Id, e.g. CR-1042..."
                                    value={changeLogSearchTerm}
                                    onchange={handleSearchTermChange}
                                ></lightning-input>

                                <template lwc:if={hasDraftLogs}>
                                    <div class="slds-m-top_small">
                                        <lightning-combobox
                                            name="existingChangeLog"
                                            label="Select Draft Change Log"
                                            value={selectedModalChangeLogId}
                                            options={draftLogOptions}
                                            onchange={handleSelectExistingChangeLog}
                                            required
                                        ></lightning-combobox>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                                        No open Draft change logs matched. Switch to <strong>Create New Change Log</strong> above to establish one.
                                    </p>
                                </template>
                            </div>
                        </template>

                        <!-- Create New Change Log -->
                        <template lwc:if={isCreateTargetMode}>
                            <div class="new-log-section">
                                <lightning-input
                                    class="modal-cr-input"
                                    type="text"
                                    name="modalChangeRequestId"
                                    label="Change Request Id"
                                    placeholder="e.g. CR-2026-081, PRJ-104, INC-8821"
                                    value={modalNewChangeRequestId}
                                    onchange={handleModalCrIdChange}
                                    required
                                    field-level-help="The approved CR or ticket number from Jira, ServiceNow, etc."
                                ></lightning-input>
                                <lightning-input
                                    type="datetime"
                                    name="modalDeploymentDate"
                                    label="Deployment Date"
                                    value={modalNewDeploymentDate}
                                    onchange={handleModalDeploymentDateChange}
                                    class="slds-m-top_small"
                                ></lightning-input>
                                <lightning-textarea
                                    name="modalDescription"
                                    label="Description"
                                    placeholder="Summary of release scope, approved tickets, or deployment details..."
                                    value={modalNewDescription}
                                    onchange={handleModalDescriptionChange}
                                    class="slds-m-top_small"
                                ></lightning-textarea>
                            </div>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={handleClosePackageModal} disabled={isPackaging}></lightning-button>
                        <lightning-button label="Confirm &amp; Package" variant="brand" onclick={handleConfirmPackage} disabled={confirmPackageDisabled}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
