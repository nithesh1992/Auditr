<template>
    <div class="audit-mode-card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="header-title">
                <h2 class="title-text">Audit Mode — Change Packaging &amp; Compliance Sign-off</h2>
            </div>
            <div class="header-actions">
                <lightning-button
                    label="New Change Log"
                    icon-name="utility:add"
                    variant="brand"
                    onclick={handleOpenCreateModal}
                ></lightning-button>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh Audit Mode"
                    title="Refresh Audit Mode"
                    onclick={handleRefresh}
                ></lightning-button-icon>
            </div>
        </div>

        <template lwc:if={errorMessage}>
            <div class="slds-scoped-notification slds-media slds-media_center slds-m-bottom_medium" role="alert">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:error" variant="error" size="small" alternative-text="Error"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p>{errorMessage}</p>
                </div>
            </div>
        </template>

        <!-- Change Logs Section -->
        <div class="section-header">
            <h3 class="slds-text-heading_small">Change Logs</h3>
            <span class="slds-text-body_small slds-text-color_weak">Packaging target: <strong>{selectedLogLabel}</strong></span>
        </div>

        <template lwc:if={hasChangeLogs}>
            <lightning-datatable
                key-field="recordId"
                data={changeLogs}
                columns={logColumns}
                max-row-selection="1"
                onrowselection={handleLogSelection}
            ></lightning-datatable>
        </template>
        <template lwc:else>
            <p class="slds-text-body_small slds-text-color_weak slds-p-vertical_x-small">
                No change logs yet. Click <strong>New Change Log</strong> to bundle audit entries against an approved Change Request.
            </p>
        </template>

        <div class="section-divider"></div>

        <!-- Unassigned Backlog Section -->
        <div class="section-header">
            <h3 class="slds-text-heading_small">Unassigned Changes Backlog</h3>
            <span class="slds-text-body_small slds-text-color_weak" title="Entries with no change log citation (count capped at 25,000)">
                {formattedBacklogCount} unpackaged change(s) match the current filter
            </span>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
            Changes outside an approved Change Request are compliance exceptions under SOX ITGC / SOC 2. Package them into a change log to attest that they are covered.
        </p>

        <div class="filter-controls">
            <div class="filter-input">
                <lightning-input
                    type="datetime"
                    name="windowStart"
                    label="Occurred From"
                    value={windowStartInput}
                    onchange={handleWindowStartChange}
                ></lightning-input>
            </div>
            <div class="filter-input">
                <lightning-input
                    type="datetime"
                    name="windowEnd"
                    label="Occurred To"
                    value={windowEndInput}
                    onchange={handleWindowEndChange}
                ></lightning-input>
            </div>
            <div class="filter-input">
                <lightning-input
                    type="text"
                    name="actor"
                    label="Responsible Actor (exact)"
                    placeholder="admin@example.com"
                    value={actorInput}
                    onchange={handleActorChange}
                ></lightning-input>
            </div>
            <div class="filter-action">
                <lightning-button
                    label="Apply Filters"
                    variant="brand"
                    icon-name="utility:filter"
                    onclick={handleApplyFilters}
                ></lightning-button>
            </div>
            <div class="filter-action">
                <lightning-input
                    type="toggle"
                    label="Group Actor Bursts"
                    name="groupBursts"
                    checked={groupBursts}
                    message-toggle-active="Grouped"
                    message-toggle-inactive="Flat"
                    onchange={handleBurstToggle}
                ></lightning-input>
            </div>
        </div>

        <div class="package-actions">
            <lightning-button
                label={packageSelectedLabel}
                variant="neutral"
                icon-name="utility:package"
                onclick={handlePackageSelected}
                disabled={packageSelectedDisabled}
            ></lightning-button>
            <lightning-button
                label={packageAllLabel}
                variant="brand"
                icon-name="utility:package"
                onclick={handleOpenConfirmAll}
                disabled={packageAllDisabled}
            ></lightning-button>
            <template lwc:if={isPackaging}>
                <lightning-spinner alternative-text="Queuing packaging job" size="x-small"></lightning-spinner>
            </template>
        </div>

        <!-- Confirm Package-All Panel -->
        <template lwc:if={isConfirmAllOpen}>
            <div class="confirm-panel" role="alertdialog" aria-label="Confirm bulk packaging">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:warning" variant="warning" size="small" alternative-text="Confirm"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p class="slds-text-body_small">
                        Package <strong>{formattedBacklogCount}</strong> unassigned change(s) into <strong>{selectedLogLabel}</strong>?
                        The window and actor filter are stored on the change log for audit reproducibility. Processing runs asynchronously.
                    </p>
                    <div class="confirm-actions">
                        <lightning-button label="Confirm Packaging" variant="brand" onclick={handleConfirmAll}></lightning-button>
                        <lightning-button label="Cancel" variant="neutral" onclick={handleCancelConfirmAll}></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <template lwc:if={hasEntryRows}>
            <lightning-datatable
                key-field="recordId"
                data={displayedRows}
                columns={entryColumns}
                onrowselection={handleEntrySelection}
            ></lightning-datatable>
        </template>
        <template lwc:else>
            <p class="slds-text-body_small slds-text-color_weak slds-p-vertical_x-small">
                No unassigned changes match the current filter. All audit events in this window are covered by change logs.
            </p>
        </template>

        <!-- New Change Log Modal -->
        <template lwc:if={isCreateModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-label="New Change Log" class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title slds-hyphenate">New Change Log</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            type="text"
                            name="changeRequestId"
                            label="Change Request Id"
                            placeholder="PROJ-1234 or CHG0011223"
                            value={newChangeRequestId}
                            onchange={handleCrIdChange}
                            required
                            field-level-help="The approved CR/ticket number from your ITSM system (Jira, ServiceNow)."
                        ></lightning-input>
                        <lightning-input
                            type="datetime"
                            name="deploymentDate"
                            label="Deployment Date"
                            value={newDeploymentDate}
                            onchange={handleDeploymentDateChange}
                            class="slds-m-top_small"
                        ></lightning-input>
                        <lightning-textarea
                            name="description"
                            label="Description"
                            placeholder="What does this change log certify?"
                            value={newDescription}
                            onchange={handleDescriptionChange}
                            class="slds-m-top_small"
                        ></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={handleCloseCreateModal} disabled={isSavingLog}></lightning-button>
                        <lightning-button label="Create Change Log" variant="brand" onclick={handleCreateSave} disabled={isSavingLog}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
