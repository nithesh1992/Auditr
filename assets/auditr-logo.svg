<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Outer Emerald Rim & Light Frosted Porcelain-Mint Background -->
    <linearGradient id="rimGrad" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <radialGradient id="ambientEmerald" cx="128" cy="128" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Smoked Glass Shield Gradients -->
    <linearGradient id="shieldOuterGrad" x1="68" y1="54" x2="188" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shieldInnerGrad" x1="76" y1="66" x2="180" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shieldSheen" x1="68" y1="54" x2="132" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Active Audit Log Bar Gradient -->
    <linearGradient id="activeBarGrad" x1="94" y1="104" x2="162" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="72%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="118" y1="142" x2="160" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Soft Glow Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#064E3B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Outer Emerald Metallic Rim -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#rimGrad)"/>

  <!-- Inner Light Frosted Squircle -->
  <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#ambientEmerald)"/>

  <!-- Smoked Glass Shield Silhouette -->
  <g filter="url(#dropShadow)">
    <!-- Outer Bezel of Shield -->
    <path d="M128 50C150 62 172 69 194 72V125C194 166 166 196 128 210C90 196 62 166 62 125V72C84 69 106 62 128 50Z" fill="url(#shieldOuterGrad)" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Inner Dark Smoked Shield Core -->
    <path d="M128 62C147 72 165 78 182 81V124C182 159 159 184 128 197C97 184 74 159 74 124V81C91 78 109 72 128 62Z" fill="url(#shieldInnerGrad)"/>

    <!-- Left Split-Glass Reflection Highlight -->
    <path d="M128 50V210C90 196 62 166 62 125V72C84 69 106 62 128 50Z" fill="url(#shieldSheen)"/>
  </g>

  <!-- Audit Trail Log Bars Inside Shield -->
  <rect x="94" y="98" width="68" height="10" rx="5" fill="url(#activeBarGrad)" filter="url(#emeraldGlow)"/>
  <rect x="94" y="98" width="48" height="10" rx="5" fill="#10B981"/>
  <rect x="136" y="98" width="26" height="10" rx="5" fill="#FFFFFF"/>

  <rect x="94" y="118" width="66" height="9" rx="4.5" fill="#334155"/>
  <rect x="94" y="118" width="38" height="9" rx="4.5" fill="#64748B"/>

  <rect x="94" y="137" width="48" height="9" rx="4.5" fill="#334155"/>
  <rect x="94" y="137" width="32" height="9" rx="4.5" fill="#64748B"/>

  <!-- Emerald Verification Checkmark -->
  <path d="M120 158L131 169L159 141" stroke="url(#checkGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)"/>
  <path d="M120 158L131 169L159 141" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
