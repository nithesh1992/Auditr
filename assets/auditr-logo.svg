<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Outer Bezel & Squircle Gradients -->
    <linearGradient id="bezelGrad" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222830"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161C20"/>
      <stop offset="50%" stop-color="#0D1114"/>
      <stop offset="100%" stop-color="#080A0C"/>
    </linearGradient>
    <radialGradient id="ambientEmerald" cx="128" cy="120" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim Glow Gradient -->
    <linearGradient id="rimGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Smoked Glass Shield Gradients -->
    <linearGradient id="shieldOuterGrad" x1="68" y1="54" x2="188" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C8B95" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#333F48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1A2228" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="shieldInnerGrad" x1="76" y1="66" x2="180" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232B32" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F1418" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="shieldSheen" x1="68" y1="54" x2="132" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Active Audit Log Bar Gradient -->
    <linearGradient id="activeBarGrad" x1="94" y1="104" x2="162" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="72%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="118" y1="142" x2="160" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Soft Glow Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Metallic Bezel -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bezelGrad)"/>

  <!-- Main Matte Carbon Squircle -->
  <rect x="18" y="18" width="220" height="220" rx="48" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="220" height="220" rx="48" fill="url(#ambientEmerald)"/>

  <!-- Luminous Emerald Rim Glow -->
  <rect x="23" y="23" width="210" height="210" rx="44" stroke="url(#rimGrad)" stroke-width="2.5" stroke-opacity="0.9" filter="url(#emeraldGlow)"/>

  <!-- Smoked Glass Shield Silhouette -->
  <g filter="url(#dropShadow)">
    <!-- Outer Frosted Glass Bezel of Shield -->
    <path d="M128 54C149 65 170 72 190 75V125C190 164 164 192 128 206C92 192 66 164 66 125V75C86 72 107 65 128 54Z" fill="url(#shieldOuterGrad)" stroke="#9CA3AF" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Inner Dark Smoked Shield Core -->
    <path d="M128 66C146 75 163 81 179 84V124C179 157 157 181 128 193C99 181 77 157 77 124V84C93 81 110 75 128 66Z" fill="url(#shieldInnerGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Left Split-Glass Reflection Highlight -->
    <path d="M128 54V206C92 192 66 164 66 125V75C86 72 107 65 128 54Z" fill="url(#shieldSheen)"/>
  </g>

  <!-- Audit Trail Log Bars Inside Shield -->
  <!-- Line 1: Illuminated Emerald + White Active Audit Event -->
  <rect x="94" y="98" width="68" height="10" rx="5" fill="url(#activeBarGrad)" filter="url(#emeraldGlow)"/>
  <rect x="94" y="98" width="48" height="10" rx="5" fill="#10B981"/>
  <rect x="136" y="98" width="26" height="10" rx="5" fill="#FFFFFF"/>

  <!-- Line 2: Muted Smoked Glass Log Bar -->
  <rect x="94" y="118" width="66" height="9" rx="4.5" fill="#1C242B" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <rect x="94" y="118" width="36" height="9" rx="4.5" fill="#2E3942" fill-opacity="0.85"/>

  <!-- Line 3: Shorter Muted Smoked Glass Log Bar -->
  <rect x="94" y="137" width="48" height="9" rx="4.5" fill="#1C242B" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <rect x="94" y="137" width="32" height="9" rx="4.5" fill="#2E3942" fill-opacity="0.75"/>

  <!-- Minimal Integrated Emerald Verification Checkmark -->
  <path d="M120 158L131 169L159 141" stroke="url(#checkGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)"/>
  <path d="M120 158L131 169L159 141" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>
</svg>